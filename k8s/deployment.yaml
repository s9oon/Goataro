apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: backend
          # CD replaces this tag with the commit SHA on every deploy.
          image: ghcr.io/s9oon/goataro-backend:IMAGE_TAG
          command: ["/app/target/release/backend"]
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: backend-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
